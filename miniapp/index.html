          var t = (now - t0) / 1000 * SPEED
          render(t)
          if (t < 3.05 && document.getElementById('boot-splash')) requestAnimationFrame(frame)
        }
        requestAnimationFrame(frame)
      })()
    </script>
    <!-- /boot-splash -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
