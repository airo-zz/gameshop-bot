    <script>
      (function () {
        window.__bootSplashStart = Date.now()
        var svg = document.querySelector('#boot-splash .bs-icon')
        if (!svg || !svg.querySelector('.pen-c').getTotalLength) return
        var q = function (s) { return svg.querySelector(s) }
        var clamp = function (v) { return Math.max(0, Math.min(1, v)) }
        var ease = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 }
        var easeOut = function (t) { return 1 - Math.pow(1 - t, 3) }
        var seg = function (t, a, b) { return clamp((t - a) / (b - a)) }
        var segEl = q('.pen-seg'), path = q('.pen-c'), bowl = q('.pen-bowl'), wedge = q('.pen-wedge')
        var tile = q('.bs-tile'), sheen = q('.bs-sheen'), tip = q('.pen-tip'), halo = q('.pen-halo')
        var word = document.querySelector('#boot-splash .bs-word')
        var L = path.getTotalLength(), BL = bowl.getTotalLength(), B0 = +bowl.getAttribute('data-before')
        var F0 = q('.pen-pre').getTotalLength(), FL = q('.pen-fillet').getTotalLength()
        var o = wedge.getAttribute('data-o').split(',').map(Number)
        segEl.style.strokeDasharray = L + ' ' + L
        bowl.style.strokeDasharray = BL + ' ' + BL
        function pen(k) {
          segEl.style.strokeDashoffset = L * (1 - k)
          bowl.style.strokeDashoffset = BL * (1 - clamp((k * L - B0) / BL))
          var a1 = 90 + 90 * clamp((k * L - F0) / FL)
          if (a1 - 90 < .01) wedge.setAttribute('d', '')
          else {
            var d = 'M' + o[0] + ',' + o[1]
            for (var i = 0; i <= 12; i++) {
              var a = (90 + (a1 - 90) * i / 12) * Math.PI / 180
              d += ' L' + (o[0] + o[2] * Math.cos(a)).toFixed(2) + ',' + (o[1] + o[2] * Math.sin(a)).toFixed(2)
            }
            wedge.setAttribute('d', d + ' Z')
          }
          var pt = path.getPointAtLength(L * k), show = Math.sin(Math.PI * Math.min(1, k * 1.02))
          tip.setAttribute('cx', pt.x); tip.setAttribute('cy', pt.y); tip.style.opacity = show
          halo.setAttribute('cx', pt.x); halo.setAttribute('cy', pt.y); halo.style.opacity = show
        }
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
          tile.style.opacity = 1; pen(1); tip.style.opacity = 0; halo.style.opacity = 0; word.classList.add('is-in'); return
        }
        var t0 = performance.now()
        function frame(now) {
          var t = (now - t0) / 1000
          var a = easeOut(seg(t, 0, .45))
          tile.style.opacity = a
          tile.style.transform = 'scale(' + (.86 + .14 * a) + ')'
          pen(ease(seg(t, .25, 1.35)))
          if (t > 1.0) word.classList.add('is-in')
          sheen.setAttribute('x', -200 + ease(seg(t, 1.35, 1.95)) * 560)
          if (t < 2 && document.getElementById('boot-splash')) requestAnimationFrame(frame)
        }
        requestAnimationFrame(frame)
      })()
    </script>
