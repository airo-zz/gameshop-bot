# Уровень http (conf.d/*.conf). Кто может встраивать страницы во фрейм:
# миниапп (/app) — Telegram Web (web.telegram.org и др.), остальное — только сам сайт
# (защита от подложенных кнопок в чужой странице — clickjacking).
map $uri $frame_ancestors {
    ~^/app      "'self' https://web.telegram.org https://*.telegram.org";
    default     "'self'";
}
