# Уровень http (conf.d/*.conf). Кто может встраивать страницы во фрейм:
# миниапп (/app) и админка (admin.redonate.gg) — ещё и Telegram Web (web.telegram.org и др.),
# остальное — только сам сайт (защита от подложенных кнопок в чужой странице — clickjacking)
# и Яндекс.Метрика: Вебвизор и карты кликов/скролла показывают сайт во фрейме
# на metrika.yandex.ru / webvisor.com — без этого «Невозможно воспроизвести посещение».
map "$host$uri" $frame_ancestors {
    ~^admin\.redonate\.gg/   "'self' https://web.telegram.org https://*.telegram.org";
    ~^[^/]+/app              "'self' https://web.telegram.org https://*.telegram.org";
    default                  "'self' https://metrika.yandex.ru https://*.metrika.yandex.ru https://metrica.yandex.com https://webvisor.com https://*.webvisor.com";
}
