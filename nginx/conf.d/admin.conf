# ─────────────────────────────────────────────────────────────────────────────
# Админка — admin.redonate.gg (сборка VITE_APP_TARGET=admin → miniapp/dist-admin).
# Вход — cookie-сессия (api/routers/admin/session_auth.py). Сертификат —
# certbot (webroot через порт 80 из gameshop.conf), продлевается вместе с остальными.
# Поисковикам закрыто: X-Robots-Tag + robots.txt.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.redonate.gg;

    ssl_certificate     /etc/letsencrypt/live/admin.redonate.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.redonate.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/conf.d/admin_headers.inc;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Слишком много запросов. Попробуйте позже."}';
    }

    # Вход в админку — строгий лимит (перебор паролей и кодов)
    location ~* ^/api/v1/admin/auth/(email|tg-request$|webapp) {
        set $upstream_api http://api:8000;
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass         $upstream_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api {
        set $upstream_api http://api:8000;
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass         $upstream_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        client_max_body_size 15m;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/admin_headers.inc;
    }

    location / {
        root /usr/share/nginx/admin;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/admin_headers.inc;

        location /assets/ {
            root /usr/share/nginx/admin;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/conf.d/admin_headers.inc;
        }
    }

    location ~ /\. { deny all; }
}
