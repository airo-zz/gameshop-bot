server {
    listen 80;
    # redonate.gg — новый основной домен (переезд), redonate.su — старый
    server_name redonate.su redonate.gg www.redonate.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name redonate.su;

    ssl_certificate     /etc/letsencrypt/live/redonate.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redonate.su/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Старый домен: API, вебхуки и /static работают как раньше (запасной вход),
    # всё остальное (сайт и Mini App) навсегда переехало на redonate.gg
    include /etc/nginx/conf.d/site_locations.inc;

    location / {
        return 301 https://redonate.gg$request_uri;
    }
}

# ── redonate.gg — новый основной домен ───────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name redonate.gg www.redonate.gg;

    ssl_certificate     /etc/letsencrypt/live/redonate.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redonate.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # www → без www
    if ($host = www.redonate.gg) {
        return 301 https://redonate.gg$request_uri;
    }

    include /etc/nginx/conf.d/site_locations.inc;
    include /etc/nginx/conf.d/web_locations.inc;
}
